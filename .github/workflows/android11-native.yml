name: Android 11 original-client runtime diagnostic

on:
  push:
    branches: [sgm-android11-validation]

permissions:
  contents: write

concurrency:
  group: sgm-android11-runtime
  cancel-in-progress: false

jobs:
  original-client:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Check hardware acceleration
        run: |
          mkdir -p runtime-evidence
          uname -a > runtime-evidence/host.txt
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm >> runtime-evidence/host.txt
      - name: Reconstruct exact signed internal build
        run: |
          git lfs pull --include=releases/SGM_Offline_TC_Candidate004.apk
          python3 ci/android11/apply_patch.py releases/SGM_Offline_TC_Candidate004.apk --patch ci/android11/internal-build.patch.gz --output /tmp/sgm-internal.apk > runtime-evidence/reconstruction.txt
      - name: Prepare official Android 11 image
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          printf 'y\n' | "$SDKMANAGER" 'platform-tools' 'emulator' 'system-images;android-30;google_apis;x86_64'
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name sgm-r11 --package 'system-images;android-30;google_apis;x86_64' --force
          "$ANDROID_HOME/emulator/emulator" -accel-check > runtime-evidence/acceleration.txt
      - name: Run original Android client and collect evidence
        env:
          SGM_INTERACTIVE_SECONDS: '900'
        run: bash ci/android11/run.sh
      - name: Preserve test evidence on a separate branch
        if: always()
        env:
          DIAGNOSTIC_STATUS: ${{ job.status }}
        run: |
          mkdir -p runtime-evidence
          python3 ci/android11/write_run_status.py
          python3 ci/android11/publish_evidence.py
